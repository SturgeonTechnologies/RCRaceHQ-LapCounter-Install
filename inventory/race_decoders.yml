---
# inventory/race_decoders.yml — OpenStint lap-timing Pis.
# Use with: ansible-playbook -i inventory/race_decoders.yml provision_race_decoder.yml
# Hostname is whatever was set in Raspberry Pi Imager; switch ansible_host to
# the IP if mDNS (.local) doesn't resolve from where you run this.
all:
  children:
    race_decoders:
      vars:
        # Network (configure_network.yml, docs/configure_network.md).
        # Wired (role race_network): eth0 is the Pi's only uplink and where
        # race control uses the app. DHCP unless set to static.
        # race_network_hostname: rcclub-track1
        # race_network_ethernet_mode: static   # dhcp (default) | static | unmanaged
        # race_network_ethernet_address: 192.168.1.50/24
        # race_network_ethernet_gateway: 192.168.1.1
        # race_network_ethernet_dns: [192.168.1.1, 1.1.1.1]
        # Wi-Fi (roles race_hotspot + race_dns): event AP on the built-in
        # radio (wlan0), always. Captive portal -> same app page as eth0
        # (check-in, live/race status, kiosk). Open SSID by default; set
        # race_hotspot_passphrase (vault it) for WPA2.
        # race_hotspot_ssid: "RC Race Event"
        # race_hotspot_channel: 6
        # Lap counter app image (deploy_lapcounter_app.yml). A tag CI pushed to
        # GHCR: sha-<7 chars> or vX.Y.Z. Bump it here to roll out a new version.
        # The image is public, so no pull token is needed.
        lapcounter_app_image_tag: ""
      hosts:
        racedecoder:
          ansible_host: racedecoder.local
          ansible_user: pi
