name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: bash -n install.sh
      - name: shellcheck
        run: shellcheck install.sh
      - name: Helper tests
        run: |
          pip install pytest pyzmq
          python -m pytest tests -q
      - name: --help works
        run: bash install.sh --help | grep -q 'Usage\|Options'
