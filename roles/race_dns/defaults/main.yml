---
# defaults/main.yml — race_dns role
#
# dnsmasq as DHCP + DNS for one LAN interface on the Pi (the event hotspot by
# default). Hands out leases, points clients at the Pi for DNS, and answers the
# event hostname (http://race) locally. Everything else is forwarded to the
# Pi's own upstream resolvers (whatever NetworkManager got on the uplink).
#
# race_hotspot passes its interface/addressing in through meta/main.yml, so
# you normally only touch these when using the role on its own.

race_dns_interface: "wlan0"
# The Pi's own address on that interface (the gateway clients get).
race_dns_address: "10.77.0.1"
race_dns_netmask: "255.255.255.0"
race_dns_dhcp_start: "10.77.0.50"
race_dns_dhcp_end: "10.77.0.250"
race_dns_lease_time: "12h"

# Names answered with race_dns_address. The first is the one people type.
# A single-label name needs the http:// (or trailing slash) in a browser bar,
# otherwise it is treated as a search; the portal always redirects with it.
race_dns_hostname: "race"
race_dns_domain: "lan"

race_dns_cache_size: 1000
