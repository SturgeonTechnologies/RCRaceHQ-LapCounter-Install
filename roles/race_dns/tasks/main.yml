---
# tasks/main.yml — race_dns role
# Install dnsmasq -> render the event-LAN config -> enable -> check it answers.

- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render /etc/dnsmasq.d/race-dns.conf
  ansible.builtin.template:
    src: race-dns.conf.j2
    dest: /etc/dnsmasq.d/race-dns.conf
    owner: root
    group: root
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq.service
    enabled: true
    state: started

- name: Apply config changes now
  ansible.builtin.meta: flush_handlers
