---
# tasks/main.yml — lapcounter_app role
# Validate -> Docker (signed apt repo) -> registry login -> compose file ->
# pull + up -> health check. Idempotent: reruns change nothing unless a var
# (usually lapcounter_app_image_tag) changed.

# ── Validate ─────────────────────────────────────────────────────────────

- name: Assert an arm64 Pi on Debian 13+ (Trixie) or Ubuntu 24.04+
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'aarch64'
      - >-
        (ansible_facts['distribution'] == 'Debian' and
         (ansible_facts['distribution_major_version'] | int) >= 13) or
        (ansible_facts['distribution'] == 'Ubuntu' and
         ansible_facts['distribution_version'] is version('24.04', '>='))
    fail_msg: >-
      The image is arm64-only and the role supports Debian 13+ (Raspberry Pi OS
      Trixie) or Ubuntu 24.04+. This host is {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} / {{ ansible_facts['architecture'] }}.

- name: Assert a pinned image tag
  ansible.builtin.assert:
    that:
      - lapcounter_app_image_tag | length > 0
      - lapcounter_app_image_tag != 'latest'
      - lapcounter_app_registry_auth in ['token', 'none']
    fail_msg: >-
      Set lapcounter_app_image_tag to a tag CI pushed (sha-<7 chars> or vX.Y.Z,
      not latest), e.g. -e lapcounter_app_image_tag=sha-abc1234. List tags with:
      gh api /orgs/SturgeonTechnologies/packages/container/rcracehq-lapcounter/versions
      --jq '.[:10][].metadata.container.tags'

- name: Assert registry credentials are set
  ansible.builtin.assert:
    that:
      - lapcounter_app_registry_username | length > 0
      - lapcounter_app_registry_token | length > 0
    fail_msg: >-
      Set lapcounter_app_registry_username and lapcounter_app_registry_token
      (a classic PAT with read:packages) in an ansible-vault file, see
      docs/deploy_lapcounter_app.md#ghcr-pull-token. Or set
      lapcounter_app_registry_auth=none for a public image.
    quiet: true
  when: lapcounter_app_registry_auth == 'token'

# ── Docker from Docker's signed apt repo ─────────────────────────────────

- name: Install Docker
  when: lapcounter_app_install_docker | bool
  block:
    - name: Create /etc/apt/keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install gnupg (fingerprint check)
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download Docker's apt key to a staging path
      ansible.builtin.get_url:
        url: "{{ lapcounter_app_docker_apt_url }}/gpg"
        dest: /etc/apt/keyrings/docker.asc.new
        owner: root
        group: root
        mode: "0644"
      changed_when: false
      check_mode: false

    - name: Read the downloaded key's fingerprints
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, /etc/apt/keyrings/docker.asc.new]
      register: lapcounter_app_docker_key
      changed_when: false
      check_mode: false

    - name: Refuse a Docker key with the wrong fingerprint
      ansible.builtin.assert:
        that: >-
          lapcounter_app_docker_gpg_fingerprint in
          (lapcounter_app_docker_key.stdout_lines | select('match', '^fpr:') |
           map('split', ':') | map(attribute=9) | list)
        fail_msg: >-
          {{ lapcounter_app_docker_apt_url }}/gpg does not contain
          {{ lapcounter_app_docker_gpg_fingerprint }}. Not installing it.

    - name: Install the verified key
      ansible.builtin.copy:
        src: /etc/apt/keyrings/docker.asc.new
        dest: /etc/apt/keyrings/docker.asc
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Add the Docker apt repo
      ansible.builtin.template:
        src: docker.sources.j2
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
      register: lapcounter_app_docker_repo

    - name: Install Docker Engine and the compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: "{{ 0 if lapcounter_app_docker_repo is changed else 3600 }}"
  always:
    - name: Remove the staged key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc.new
        state: absent
      changed_when: false

- name: Rotate container logs (protects the SD card)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Apply Docker config changes before starting containers
  ansible.builtin.meta: flush_handlers

# ── Registry login (read-only token in root's Docker config) ─────────────

- name: Create root's Docker config folder
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: lapcounter_app_registry_auth == 'token'

# Same file `docker login` writes; templated so reruns don't report a change.
- name: Write the registry token to root's Docker config
  ansible.builtin.template:
    src: docker-config.json.j2
    dest: /root/.docker/config.json
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  when: lapcounter_app_registry_auth == 'token'

# ── App ──────────────────────────────────────────────────────────────────

- name: Create the compose folder
  ansible.builtin.file:
    path: "{{ lapcounter_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the data folder (owned by the image's lapcounter user)
  ansible.builtin.file:
    path: "{{ lapcounter_app_data_dir }}"
    state: directory
    owner: "{{ lapcounter_app_uid }}"
    group: "{{ lapcounter_app_uid }}"
    mode: "0750"

- name: Look at the decoder's .rc4 folder (transponder learning writes here)
  ansible.builtin.stat:
    path: "{{ lapcounter_app_rc4_dir }}"
  register: lapcounter_app_rc4_stat

- name: Assert the .rc4 folder exists and its group can write it
  ansible.builtin.assert:
    that:
      - lapcounter_app_rc4_stat.stat.exists
      - lapcounter_app_rc4_stat.stat.isdir
      - lapcounter_app_rc4_stat.stat.wgrp
    fail_msg: >-
      {{ lapcounter_app_rc4_dir }} is missing or not group-writable
      ({{ lapcounter_app_rc4_stat.stat.mode | default('missing') }}). Run
      provision_race_decoder.yml first; the openstint package creates it root:users 2775.
    quiet: true

- name: Render compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ lapcounter_app_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Pull the image (if not already on the Pi) and start lapd + web
  community.docker.docker_compose_v2:
    project_src: "{{ lapcounter_app_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: "{{ lapcounter_app_wait_timeout }}"
  environment:
    HOME: /root
    DOCKER_CONFIG: /root/.docker

# ── Check ────────────────────────────────────────────────────────────────

- name: Check the web app's health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ lapcounter_app_web_port }}/healthz"
    status_code: 200
  register: lapcounter_app_health
  retries: 10
  delay: 3
  until: lapcounter_app_health.status == 200
  check_mode: false
  when: not ansible_check_mode

- name: Summary
  ansible.builtin.debug:
    msg:
      - "Image:   {{ lapcounter_app_image }}"
      - "Web:     http://{{ ansible_host | default(inventory_hostname) }}:{{ lapcounter_app_web_port }}/"
      - "Status:  cd {{ lapcounter_app_dir }} && sudo docker compose ps"
      - "Logs:    cd {{ lapcounter_app_dir }} && sudo docker compose logs -f lapd web"
