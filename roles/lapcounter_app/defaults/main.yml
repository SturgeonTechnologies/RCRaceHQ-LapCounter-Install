---
# defaults/main.yml — lapcounter_app role
#
# Installs Docker on the race-decoder Pi and runs the lap counter app (lapd +
# web) from the image that RCRaceHQ-LapCounter-App's CI pushes to GHCR. Run
# provision_race_decoder.yml first. The image is public, so no login is
# needed by default. See README.md.

# ── Image ───────────────────────────────────────────────────────────────
lapcounter_app_registry: "ghcr.io"
lapcounter_app_image_repository: "{{ lapcounter_app_registry }}/sturgeontechnologies/rcracehq-lapcounter"
# Required. A tag CI pushed: sha-<7 chars> for any main commit, or vX.Y.Z for a
# release. CI never re-pushes an existing tag, so a tag always means the same
# image and the Pi only downloads it once (it keeps working offline at the track).
lapcounter_app_image_tag: ""
lapcounter_app_image: "{{ lapcounter_app_image_repository }}:{{ lapcounter_app_image_tag }}"
# "token" = log in to the registry with the username + token below.
# "none" = no registry login (a public image, or one loaded with docker load).
lapcounter_app_registry_auth: "none"
# GitHub user that owns the token, and a classic PAT with only read:packages
# (GHCR doesn't take fine-grained tokens). Put both in an ansible-vault file,
# e.g. inventory/group_vars/race_decoders/vault.yml. Written to root's
# /root/.docker/config.json (mode 0600) on the Pi.
lapcounter_app_registry_username: ""
lapcounter_app_registry_token: ""

# ── Docker ──────────────────────────────────────────────────────────────
# false = Docker + the compose plugin are already installed; don't touch apt.
lapcounter_app_install_docker: true
# Docker publishes separate debian/ and ubuntu/ repos (same signing key).
lapcounter_app_docker_apt_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
# Docker's release key (primary fingerprint). The role refuses a key that
# doesn't match.
lapcounter_app_docker_gpg_fingerprint: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
# Container logs go to Docker's "local" driver with rotation, so a chatty
# container can't fill the SD card.
lapcounter_app_docker_log_max_size: "10m"
lapcounter_app_docker_log_max_file: 3

# ── App ─────────────────────────────────────────────────────────────────
# compose.yaml lives here; `docker compose` commands run from this folder.
lapcounter_app_dir: "/opt/lapcounter"
# SQLite database (bind-mounted at /var/lib/lapcounter in both containers).
# Owned by the image's uid 10001.
lapcounter_app_data_dir: "/var/lib/lapcounter"
lapcounter_app_uid: 10001
# The web container binds 0.0.0.0:8080. People don't type this port: race-portal
# owns port 80 and proxies the app, so it's http://race/ on the event Wi-Fi and
# http://<pi>.local/ on the wired side. :8080 stays reachable on eth0 only.
lapcounter_app_web_port: 8080
# lapd reads the decoder's feed on the Pi itself.
lapcounter_app_decoder_zmq: "tcp://127.0.0.1:{{ openstint_decoder_zmq_port | default(5556) }}"
# Seconds without a decoder S line before the UI shows the decoder offline.
lapcounter_app_decoder_stale_s: 5
# OpenStint's .rc4 folder. Mounted read-write into the web container at the same
# path (OPENSTINT_RC4_DIR) so Admin → Transponders → Record can rename learned
# files. The container joins the folder's group (read from the Pi), which the
# openstint package sets to `users` with mode 2775.
lapcounter_app_rc4_dir: "{{ openstint_decoder_registry_dir | default('/var/lib/openstint') }}"
# RC Race HQ API for Settings → Link (pairing to a club). Empty turns Link off.
lapcounter_app_rcracehq_api_url: "https://www.rcracehq.com/api"
# How long to wait for the containers to come up healthy.
lapcounter_app_wait_timeout: 180
