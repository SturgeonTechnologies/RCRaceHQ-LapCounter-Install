---
# tasks/main.yml — openstint_decoder role
# Validate -> install (apt repo or source build) -> config -> learn helper -> service
# -> sanity checks. Idempotent: reruns change nothing unless a var changed.

# ── Validate the target ──────────────────────────────────────────────────

- name: Pick the install method
  ansible.builtin.set_fact:
    openstint_decoder_method: >-
      {{ openstint_decoder_install_method
         if openstint_decoder_install_method != 'auto'
         else ('apt' if openstint_decoder_upstream_deb_ok | bool else 'source') }}
  vars:
    openstint_decoder_upstream_deb_ok: >-
      {{ ansible_facts['architecture'] == 'aarch64'
         and ansible_facts['distribution'] == 'Debian'
         and (ansible_facts['distribution_major_version'] | int) >= 13 }}

- name: Assert a supported target for that method
  ansible.builtin.assert:
    that:
      - openstint_decoder_method in ['apt', 'source']
      - ansible_facts['architecture'] in (['aarch64'] if openstint_decoder_method == 'apt' else ['aarch64', 'x86_64'])
      - >-
        (ansible_facts['distribution'] == 'Debian' and (ansible_facts['distribution_major_version'] | int) >= 13)
        or (ansible_facts['distribution'] == 'Ubuntu' and (ansible_facts['distribution_version'] is version('24.04', '>=')))
    fail_msg: >-
      install_method={{ openstint_decoder_method }} needs Debian 13+ or Ubuntu 24.04+
      ({{ 'arm64 only: upstream publishes no other .deb' if openstint_decoder_method == 'apt' else 'arm64 or amd64' }}).
      This host is {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} / {{ ansible_facts['architecture'] }}.

- name: Read the board model
  ansible.builtin.slurp:
    src: /proc/device-tree/model
  register: openstint_decoder_model_raw
  failed_when: false

- name: Warn on boards older than a Pi 3 Model B+
  ansible.builtin.debug:
    msg: >-
      {{ openstint_decoder_model }} is below upstream's minimum (Pi 3 Model B+).
      It may drop sample buffers; watch the 4th/5th fields of the S lines.
  vars:
    openstint_decoder_model: "{{ (openstint_decoder_model_raw.content | default('') | b64decode).rstrip('\x00') }}"
  when:
    - openstint_decoder_model | length > 0
    - openstint_decoder_model is search('Raspberry Pi (1|2|Zero|3 Model B Rev)')

# ── Install the openstint package ────────────────────────────────────────
# apt: upstream's arm64 .deb from its pinned repo (Raspberry Pi OS Trixie).
# source: build that same .deb on the host with upstream's packaging script,
# so the dependencies match this release/arch (Ubuntu, amd64). Same package
# name, unit and conffile either way, so everything below is shared.

- name: Install openstint ({{ openstint_decoder_method }})
  ansible.builtin.include_tasks: "install_{{ openstint_decoder_method }}.yml"

# ── USB access ───────────────────────────────────────────────────────────
# The package pulls in rtl-sdr, whose udev rule makes the dongle 0660 group
# plugdev (the service joins plugdev via SupplementaryGroups). udev only applies
# a new rule when a device is added, so a dongle that was already plugged in
# during install keeps root-only perms and the decoder fails with
# "usb_open error -3" until it's replugged. Re-trigger it instead; the
# service retries every 5 s, so it picks the new perms up on its own.

- name: Keep the DVB-T kernel driver off the dongle
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-rtlsdr-dvb.conf
    content: |
      # Managed by Ansible (openstint_decoder). The RTL2832U is an SDR here, not a TV tuner.
      blacklist dvb_usb_rtl28xxu
      blacklist rtl2832
      blacklist rtl2830
    owner: root
    group: root
    mode: "0644"

- name: Unload the DVB-T driver if it already claimed the dongle
  community.general.modprobe:
    name: dvb_usb_rtl28xxu
    state: absent

- name: Re-apply udev rules to RTL-SDR dongles already plugged in
  ansible.builtin.shell: |
    set -e
    udevadm control --reload-rules
    udevadm trigger --action=add --subsystem-match=usb --attr-match=idVendor=0bda
    udevadm settle
  changed_when: false

# ── Config + helper ──────────────────────────────────────────────────────

- name: Render /etc/openstint.conf
  ansible.builtin.template:
    src: openstint.conf.j2
    dest: /etc/openstint.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart openstint

- name: Let login users edit the .rc4 registry without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: users
    append: true
  loop: "{{ openstint_decoder_registry_users }}"

- name: Install openstint-learn
  ansible.builtin.copy:
    src: openstint-learn
    dest: /usr/local/bin/openstint-learn
    owner: root
    group: root
    mode: "0755"

- name: Enable and start the decoder
  ansible.builtin.systemd_service:
    name: openstint.service
    enabled: true
    state: started

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
  when: openstint_decoder_manage_ufw | bool

- name: Allow SSH through ufw (before enabling it)
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: openstint_decoder_manage_ufw | bool

- name: Allow the decoder's ZeroMQ feed from the timing network only
  community.general.ufw:
    rule: allow
    port: "{{ openstint_decoder_zmq_port | string }}"
    proto: tcp
    from_ip: "{{ openstint_decoder_zmq_allowed_cidr }}"
  when: openstint_decoder_manage_ufw | bool

- name: Enable ufw (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: openstint_decoder_manage_ufw | bool

- name: Apply config changes now
  ansible.builtin.meta: flush_handlers

# ── Sanity checks (report, don't fail: the SDR may simply be unplugged) ──

- name: Look for an RTL-SDR on USB (0bda:2838 / 0bda:2832)
  ansible.builtin.command: lsusb
  register: openstint_decoder_lsusb
  changed_when: false
  failed_when: false

- name: Read service state
  ansible.builtin.service_facts:

- name: Summary
  ansible.builtin.debug:
    msg:
      - "openstint.service: {{ ansible_facts.services['openstint.service'].state | default('unknown') }}"
      - "RTL-SDR on USB: {{ 'yes' if openstint_decoder_lsusb.stdout is search('0bda:283[28]') else 'NOT FOUND (plug it in; the service retries every 5 s)' }}"
      - "Watch it:  journalctl -u openstint -f   (S lines every second)"
      - "Learn one: openstint-learn <label number>"
      - "Feed:      tcp://{{ ansible_host | default(inventory_hostname) }}:{{ openstint_decoder_zmq_port }}"
