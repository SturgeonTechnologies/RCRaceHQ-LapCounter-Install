---
# handlers/main.yml — race_hotspot role

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart race-portal-firewall
  ansible.builtin.systemd_service:
    name: race-portal-firewall.service
    state: restarted

- name: Restart race-portal
  ansible.builtin.systemd_service:
    name: race-portal.service
    state: restarted

- name: Bring up the hotspot
  ansible.builtin.command: nmcli connection up race-hotspot
  changed_when: true
