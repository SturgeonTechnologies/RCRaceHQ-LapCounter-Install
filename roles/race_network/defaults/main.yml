---
# defaults/main.yml — race_network role
#
# The Pi's own network: hostname and the wired port. eth0 is the Pi's only
# uplink: internet, RC Race HQ sync, and the race-control web UI all go over
# it. It's DHCP unless you give it a static address.
#
# Wi-Fi is the built-in radio (wlan0) and only ever the event hotspot:
# race_hotspot_* (SSID, passphrase, channel). The Pi never joins a Wi-Fi
# network as a client.

# ── Hostname ────────────────────────────────────────────────────────────
# Empty = leave it. Also the mDNS name: http://<hostname>.local/
race_network_hostname: ""

# ── Wired (eth0) ────────────────────────────────────────────────────────
race_network_ethernet_interface: "eth0"
# dhcp      = managed by this role, address from DHCP (default).
# static    = managed by this role, fixed address below.
# unmanaged = leave it as the OS set it up; switching to this removes the
#             role's config.
race_network_ethernet_mode: "dhcp"
race_network_ethernet_address: "" # CIDR, e.g. 192.168.1.50/24
race_network_ethernet_gateway: "" # e.g. 192.168.1.1
race_network_ethernet_dns: [] # e.g. [192.168.1.1, 1.1.1.1]
race_network_ethernet_metric: 100

# ── Hotspot radio (read from race_hotspot so the wired port never uses it) ─
race_network_hotspot_interface: "{{ race_hotspot_interface | default('wlan0') }}"
