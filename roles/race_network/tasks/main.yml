---
# tasks/main.yml — race_network role
# Validate -> hostname -> NetworkManager check -> wired port (last: it can
# move the SSH session) -> check eth0 is the uplink.

- name: Validate settings
  ansible.builtin.import_tasks: validate.yml

- name: Work out what this run manages
  ansible.builtin.set_fact:
    race_network_ubuntu: "{{ ansible_facts['distribution'] == 'Ubuntu' }}"
    race_network_manage_wired: "{{ race_network_ethernet_mode != 'unmanaged' }}"

# ── Hostname ────────────────────────────────────────────────────────────

- name: Set the hostname
  when: race_network_hostname | length > 0
  block:
    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ race_network_hostname }}"
        use: systemd

    - name: Point 127.0.1.1 at the hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1\t{{ race_network_hostname }}"

    - name: Look for cloud-init (Ubuntu images)
      ansible.builtin.stat:
        path: /etc/cloud/cloud.cfg.d
      register: race_network_cloud_init

    # Otherwise cloud-init puts the image's hostname back on the next boot.
    - name: Keep cloud-init from resetting the hostname
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-race-network-hostname.cfg
        content: |
          # Managed by Ansible (role race_network)
          preserve_hostname: true
        owner: root
        group: root
        mode: "0644"
      when: race_network_cloud_init.stat.exists

# ── NetworkManager ──────────────────────────────────────────────────────

- name: Look for nmcli
  ansible.builtin.stat:
    path: /usr/bin/nmcli
  register: race_network_nmcli

# Raspberry Pi OS: eth0 is a NetworkManager profile. (Ubuntu: netplan/networkd.)
- name: Check NetworkManager is running
  ansible.builtin.command: nmcli -t -f RUNNING general
  register: race_network_nm
  changed_when: false
  failed_when: race_network_nm.rc != 0 or race_network_nm.stdout != 'running'
  when: race_network_manage_wired and not race_network_ubuntu

# PR #12 briefly let the Pi join Wi-Fi networks as a client on a second
# radio. Wi-Fi is the hotspot only now; clear any profiles that made.
- name: List NetworkManager profiles
  ansible.builtin.command: nmcli -t -f NAME connection show
  register: race_network_profiles_now
  changed_when: false
  when: race_network_nmcli.stat.exists

- name: Delete old client Wi-Fi profiles
  ansible.builtin.command: nmcli connection delete {{ item | quote }}
  loop: "{{ race_network_profiles_now.stdout_lines | select('match', '^race-wifi-') | list }}"
  changed_when: true
  when: race_network_nmcli.stat.exists

# ── Wired port ──────────────────────────────────────────────────────────
# Last, because it can bounce eth0 (and with a new static address, end the
# SSH session). The change is applied in the background, then we reconnect.

- name: Remember the address we're connected on
  ansible.builtin.set_fact:
    race_network_ip_before: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
    race_network_ip_after: >-
      {{ race_network_ethernet_address.split('/')[0]
         if race_network_ethernet_mode == 'static'
         else ansible_facts['default_ipv4']['address'] | default('') }}

- name: Wired port through NetworkManager (Raspberry Pi OS)
  when: not race_network_ubuntu
  block:
    - name: Create the wired profile
      community.general.nmcli:
        conn_name: race-eth0
        type: ethernet
        ifname: "{{ race_network_ethernet_interface }}"
        method4: "{{ 'manual' if race_network_ethernet_mode == 'static' else 'auto' }}"
        ip4: "{{ race_network_ethernet_address if race_network_ethernet_mode == 'static' else omit }}"
        gw4: "{{ race_network_ethernet_gateway if race_network_ethernet_mode == 'static' else omit }}"
        dns4: "{{ race_network_ethernet_dns if race_network_ethernet_dns | length > 0 else omit }}"
        route_metric4: "{{ race_network_ethernet_metric | int }}"
        autoconnect: true
        # Beat the "Wired connection 1" profile NetworkManager made at first boot.
        autoconnect_priority: 100
        state: present
      register: race_network_wired_nm
      when: race_network_manage_wired

    - name: Remove the wired profile (back to the OS default)
      community.general.nmcli:
        conn_name: race-eth0
        state: absent
      register: race_network_wired_nm_removed
      when: not race_network_manage_wired and race_network_nmcli.stat.exists

    # Not a handler: it has to run here, before the reconnect/end_host below.
    - name: Apply the wired profile in the background # noqa: no-handler
      ansible.builtin.command: nmcli connection up race-eth0
      async: 60
      poll: 0
      changed_when: true
      when: race_network_wired_nm is changed

- name: Wired port through netplan (Ubuntu)
  when: race_network_ubuntu
  block:
    # Merged over 50-cloud-init.yaml: same `eth0` key, so these values win.
    - name: Write the netplan wired config
      ansible.builtin.template:
        src: 60-race-network.yaml.j2
        dest: /etc/netplan/60-race-network.yaml
        owner: root
        group: root
        mode: "0600"
        validate: >-
          sh -c 'd=$(mktemp -d) && mkdir -p "$d/etc/netplan"
          && cp %s "$d/etc/netplan/60-race-network.yaml"
          && netplan generate --root-dir "$d"; rc=$?; rm -rf "$d"; exit $rc'
      register: race_network_wired_netplan
      when: race_network_manage_wired

    - name: Remove the netplan wired config (back to the OS default)
      ansible.builtin.file:
        path: /etc/netplan/60-race-network.yaml
        state: absent
      register: race_network_wired_netplan_removed
      when: not race_network_manage_wired

    - name: Apply netplan in the background
      ansible.builtin.command: netplan apply
      async: 60
      poll: 0
      changed_when: true
      when: race_network_wired_netplan is changed or race_network_wired_netplan_removed is changed

- name: Work out whether the wired port changed
  ansible.builtin.set_fact:
    race_network_wired_changed: >-
      {{ (race_network_wired_nm | default({})) is changed
         or (race_network_wired_nm_removed | default({})) is changed
         or (race_network_wired_netplan | default({})) is changed
         or (race_network_wired_netplan_removed | default({})) is changed }}

- name: Moved to a new address, stop here
  when:
    - race_network_wired_changed | bool
    - race_network_ip_after != race_network_ip_before
  block:
    - name: Say where the Pi went
      ansible.builtin.debug:
        msg:
          - "{{ race_network_ethernet_interface }} is moving from {{ race_network_ip_before }} to {{ race_network_ip_after }}."
          - "This SSH session will drop. Set ansible_host: {{ race_network_ip_after }} in the inventory and rerun."
          - "If the Pi doesn't answer there, plug in a screen and keyboard and check: ip -4 addr show {{ race_network_ethernet_interface }}"

    - name: End this host's run
      ansible.builtin.meta: end_host

- name: Wait for the Pi to come back after the wired change
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 90
  when: race_network_wired_changed | bool

# ── Check ───────────────────────────────────────────────────────────────

- name: Read the default route
  ansible.builtin.command: ip -4 route show default
  register: race_network_default_route
  changed_when: false

- name: Warn when eth0 isn't the uplink
  ansible.builtin.debug:
    msg: >-
      No default route via {{ race_network_ethernet_interface }}
      ({{ race_network_default_route.stdout or 'no default route at all' }}).
      The Pi gets internet only over the wired port: check the cable and
      that the track network hands out an address (or the static gateway).
  when: ("dev " ~ race_network_ethernet_interface ~ " ") not in (race_network_default_route.stdout ~ " ")

- name: Summary
  ansible.builtin.debug:
    msg:
      - "Hostname: {{ race_network_hostname or ansible_facts['hostname'] }}"
      - >-
        Wired:    {{ race_network_ethernet_interface }} {{ race_network_ethernet_mode }}
        {{- (' ' ~ race_network_ethernet_address) if race_network_ethernet_mode == 'static' else '' }}
      - "Route:    {{ race_network_default_route.stdout_lines | join(' | ') or 'none' }}"
      - "Wi-Fi:    {{ race_network_hotspot_interface }} is the event hotspot only (race_hotspot)"
