---
# configure_network.yml — only the Pi's network: hostname + wired port (role
# race_network), then the event Wi-Fi access point on the built-in radio
# (role race_hotspot, always). The same roles provision_race_decoder.yml
# runs; use this to change network settings without touching the decoder.
# Docs: docs/configure_network.md
- name: Configure the lap counter's network
  hosts: race_decoders
  become: true
  gather_facts: true # distribution + current address
  roles:
    - race_network
    - role: race_hotspot
