---
# deploy_lapcounter_app.yml — install Docker and run the lap counter app
# (lapd + web) from a pinned image that RCRaceHQ-LapCounter-App's CI pushed to GHCR.
# Docs: docs/deploy_lapcounter_app.md
#
# Run provision_race_decoder.yml first. Needs the GHCR pull token
# (lapcounter_app_registry_username / _token, in an ansible-vault file) and
# lapcounter_app_image_tag in inventory, or -e lapcounter_app_image_tag=…
- name: Deploy the lap counter app
  hosts: race_decoders
  become: true
  gather_facts: true # needs architecture / distribution for the asserts
  roles:
    - lapcounter_app
